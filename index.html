<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:calc(78px + env(safe-area-inset-bottom));min-height:100vh}.shell{max-width:850px;margin:auto;padding:0 14px 18px}.brandbar{position:sticky;top:0;z-index:30;background:rgba(8,8,8,.98);display:flex;align-items:center;gap:10px;padding:calc(3px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid #222}.logoimg{width:50px;height:50px;border-radius:13px;object-fit:cover;flex:0 0 50px}.brandcopy{min-width:0}.brandname{font-weight:950;font-size:17px;line-height:1}.subtitle{color:var(--red);font-weight:850;font-size:10px;letter-spacing:1.7px;margin-top:5px}.profileBtn{margin-left:auto;background:#1b1b1b;border:1px solid #3b3b3b;color:#fff;border-radius:999px;padding:9px 11px;font-weight:800;font-size:12px}.card{background:linear-gradient(145deg,#171717,#111);border:1px solid var(--line);border-radius:18px;padding:15px}.grid{display:grid;gap:10px}.metrics{grid-template-columns:1fr 1fr;margin-top:11px}.metric{font-size:26px;font-weight:900;margin-top:7px}.muted{color:var(--muted)}.small{font-size:12px}.section{margin-top:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.red{color:var(--red)}.amber{color:var(--amber)}.progress{height:10px;background:#222;border-radius:99px;overflow:hidden}.progress span{height:100%;display:block;background:var(--red)}.milestones{display:flex;justify-content:space-between;margin-top:13px}.pill{border:1px solid #3a3a3a;border-radius:99px;padding:6px 10px;color:#bbb;font-size:12px}.weekBanner{margin-top:11px;background:linear-gradient(135deg,#251013,#111);border:1px solid #4a2023;border-radius:16px;padding:13px}.weekTitle{font-size:20px;font-weight:900}.quick{grid-template-columns:1fr 1fr;margin-top:8px}.action{background:#151515;border:1px solid #333;border-radius:16px;padding:16px 7px;text-align:center;color:#fff;font-weight:750}.action b{display:block;color:var(--red);font-size:24px;margin-bottom:6px}.panel{display:none}.panel.active{display:block}.input{width:100%;background:#202020;border:1px solid #3b3b3b;color:#fff;border-radius:11px;padding:11px;font-size:16px}.btn{background:var(--red);border:0;color:#fff;border-radius:11px;padding:12px 13px;font-weight:800}.btn.secondary{background:#202020;border:1px solid #3b3b3b}.btn.good{background:#123b20;color:#8ff0aa;border:1px solid #28693a}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(9,9,9,.98);border-top:1px solid #333;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:40}.navin{max-width:850px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:#aaa;padding:9px 2px;font-size:11px}.nav button.active{color:var(--red)}label{display:block;margin-top:10px}.exercise{border-top:1px solid #333;padding:14px 0}.exercise:first-child{border-top:0}.exerciseHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.exercise h3{margin:0;font-size:16px}.demo{color:#ff5b62;text-decoration:none;font-weight:800;font-size:12px;white-space:nowrap}.last{font-size:12px;color:#9f9f9f;margin-top:4px}.target{font-size:12px;color:var(--amber);margin-top:4px}.setrow{display:grid;grid-template-columns:34px 1fr 1fr 54px;gap:7px;align-items:center;margin-top:8px}.setnum{font-weight:800;color:#aaa;text-align:center}.check{height:42px;border-radius:10px;border:1px solid #444;background:#222;color:#bbb;font-size:17px}.check.done{background:#123b20;color:#8ff0aa;border-color:#28693a}.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 2px}.tab{border:1px solid #333;background:#151515;color:#bbb;border-radius:99px;padding:8px 11px;white-space:nowrap}.tab.active{background:#341315;border-color:#7a252c;color:#fff}.historyItem{padding:10px 0;border-top:1px solid #333}.historyItem:first-child{border:0}.goalTag{display:inline-block;color:#ff5960;border:1px solid #5b2529;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-top:6px}.overlay{position:fixed;inset:0;z-index:1000;background:#080808;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.setup{max-width:620px;margin:auto}.setup h1{font-size:30px;margin:10px 0 6px}.setup .lead{color:#aaa;margin-bottom:18px}.setup .box{background:#141414;border:1px solid #333;border-radius:18px;padding:16px}.setup label{display:block;margin:12px 0 5px;color:#bbb;font-size:13px;font-weight:700}.setup input,.setup select{width:100%;background:#202020;border:1px solid #3b3b3b;color:#fff;border-radius:11px;padding:13px;font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;margin-top:16px;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:900;font-size:16px}.closeSetup{width:100%;margin-top:9px;background:#202020;color:#fff;border:1px solid #3b3b3b;border-radius:12px;padding:13px;font-weight:800}
@media(max-width:430px){.two{grid-template-columns:1fr}.profileBtn{padding:8px 9px;font-size:11px}}@media(min-width:600px){.metrics{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(4,1fr)}}

<body>
<main class="shell">
<header class="brandbar"><img class="logoimg" src="C62298BA-6FFE-40CA-A7F8-BF17D81C7522.png" alt="Driverseat Workout Planner"><div class="brandcopy"><div class="brandname">DRIVERSEAT</div><div class="subtitle">WORKOUT PLANNER</div></div><button id="profileBtn" class="profileBtn" type="button">Profile</button></header>
<section id="home" class="panel active"><div class="grid metrics"><div class="card"><div class="muted">Current Weight</div><div id="cw" class="metric">—</div></div><div class="card"><div class="muted">7-Day Avg</div><div id="avg" class="metric">—</div></div><div class="card"><div class="muted">Calories</div><div id="calMetric" class="metric">—</div></div><div class="card"><div class="muted">To Goal</div><div id="tg" class="metric">—</div></div></div><div class="card section"><div class="row"><b id="goalTitle">Goal Progress</b><b id="pct" class="red">0%</b></div><div class="progress" style="margin-top:12px"><span id="bar"></span></div><div id="milestones" class="milestones"></div></div><div id="homeWeek" class="weekBanner"></div><div class="card section"><h3>Weekly Guidance</h3><div id="guide" class="muted"></div></div><div class="card section"><h3>Training Split</h3><div id="splitText" class="muted"></div></div><h3>Quick Actions</h3><div class="grid quick"><button class="action" data-go="daily"><b>✎</b>Log Daily</button><button class="action" data-go="workouts"><b>🏋</b>Start Workout</button><button class="action" data-go="progress"><b>◉</b>Measurements</button><button class="action" data-go="progress"><b>▥</b>Progress</button></div></section>
<section id="daily" class="panel"><div class="card section"><h2>Daily Log</h2><form id="df"><label>Date<input id="date" class="input" type="date" required></label><label>Morning weight<input id="weight" class="input" type="number" step=".1" required></label><label>Calories<input id="cal" class="input" type="number" required></label><label>Sleep hours<input id="sleep" class="input" type="number" step=".25"></label><label>Steps<input id="steps" class="input" type="number"></label><button class="btn" style="margin-top:12px">Save Day</button></form><div id="dh" class="muted section"></div></div></section>
<section id="workouts" class="panel"><div id="weekBanner" class="weekBanner"></div><div id="workoutTabs" class="tabs section"></div><div id="workoutArea"></div><div class="card section"><h3 style="margin-top:0">Recent workouts</h3><div id="workoutHistory" class="muted"></div></div></section>
<section id="progress" class="panel"><div class="card section"><h2>Progress</h2><div id="ph"></div></div></section>
<section id="settings" class="panel"><div class="card section"><h2>Settings</h2><p class="muted">Your profile, goals and tracking data are currently stored on this device.</p><div id="profileSummary"></div><button id="editProfile" class="btn secondary" type="button" style="margin-top:12px">Edit Weight, Goal & Plan</button></div></section>
</main>
<nav class="nav"><div class="navin"><button class="active" data-v="home">Home</button><button data-v="daily">Daily</button><button data-v="workouts">Workouts</button><button data-v="progress">Progress</button><button data-v="settings">Settings</button></div></nav>
<script>
const PROFILE_KEY='ds_profile_v2',DAILY_KEY='ds_daily',WORKOUT_KEY='ds_workouts_v2',DRAFT_KEY='ds_workout_draft';
const IMG='C62298BA-6FFE-40CA-A7F8-BF17D81C7522.png';
const E=(name,sets,min,max)=>({name,sets,min,max});
const plans=[
{name:'Upper 1',weeks:[[E('Incline Dumbbell Press',3,6,10),E('Chest-Supported Row',3,8,12),E('Machine Chest Press',3,8,12),E('Lat Pulldown',3,8,12),E('Cable Lateral Raise',3,12,20),E('Rope Triceps Pushdown',3,10,15),E('Dumbbell Curl',3,10,15)],[E('Incline Machine Press',3,8,12),E('Single-Arm Cable Row',3,8,12),E('Flat Dumbbell Press',3,6,10),E('Neutral-Grip Lat Pulldown',3,8,12),E('Dumbbell Lateral Raise',3,12,20),E('Overhead Cable Triceps Extension',3,10,15),E('Hammer Curl',3,10,15)],[E('Incline Dumbbell Press',3,6,10),E('Seated Cable Row',3,8,12),E('Machine Chest Press',3,8,12),E('Assisted Pull-Up',3,6,10),E('Cable Lateral Raise',3,12,20),E('Straight-Bar Pushdown',3,10,15),E('EZ-Bar Curl',3,8,12)],[E('Machine Incline Press',2,10,12),E('Chest-Supported Machine Row',2,10,12),E('Cable Fly',2,12,15),E('Lat Pulldown',2,10,12),E('Lateral Raise',2,15,20),E('Rope Pushdown',2,12,15),E('Cable Curl',2,12,15)]]},
{name:'Lower 1',weeks:[[E('Hack Squat',3,6,10),E('Romanian Deadlift',3,8,10),E('Leg Extension',3,10,15),E('Seated Leg Curl',3,10,15),E('Standing Calf Raise',3,10,15),E('Cable Crunch',3,10,15)],[E('Leg Press',3,8,12),E('Dumbbell Romanian Deadlift',3,8,12),E('Single-Leg Extension',3,10,15),E('Lying Leg Curl',3,10,15),E('Seated Calf Raise',3,10,15),E('Ab Crunch Machine',3,10,15)],[E('Hack Squat',3,6,10),E('Barbell Romanian Deadlift',3,6,10),E('Leg Extension',3,10,15),E('Seated Leg Curl',3,10,15),E('Standing Calf Raise',3,10,15),E('Hanging Knee Raise',3,10,15)],[E('Leg Press',2,10,12),E('Romanian Deadlift',2,10,12),E('Leg Extension',2,12,15),E('Leg Curl',2,12,15),E('Calf Raise',2,12,15),E('Cable Crunch',2,12,15)]]},
{name:'Upper 2',weeks:[[E('Flat Dumbbell Press',3,6,10),E('Neutral-Grip Pulldown',3,8,12),E('Seated Cable Row',3,8,12),E('Machine Shoulder Press',3,8,12),E('Pec Deck',2,10,15),E('Lateral Raise',3,12,20),E('Cable Curl',3,10,15),E('Overhead Cable Triceps Extension',3,10,15)],[E('Machine Chest Press',3,8,12),E('Assisted Pull-Up',3,6,10),E('High Row Machine',3,8,12),E('Dumbbell Shoulder Press',3,8,12),E('Cable Fly',2,10,15),E('Cable Y-Raise',3,12,20),E('Incline Dumbbell Curl',3,10,15),E('Rope Triceps Pushdown',3,10,15)],[E('Flat Dumbbell Press',3,6,10),E('Lat Pulldown',3,8,12),E('Single-Arm Machine Row',3,8,12),E('Machine Shoulder Press',3,8,12),E('Pec Deck',2,10,15),E('Dumbbell Lateral Raise',3,12,20),E('Hammer Curl',3,10,15),E('Overhead Cable Triceps Extension',3,10,15)],[E('Machine Chest Press',2,10,12),E('Neutral-Grip Pulldown',2,10,12),E('Seated Cable Row',2,10,12),E('Machine Shoulder Press',2,10,12),E('Cable Fly',2,12,15),E('Lateral Raise',2,15,20),E('Cable Curl',2,12,15),E('Rope Pushdown',2,12,15)]]},
{name:'Lower 2',weeks:[[E('Leg Press',3,8,12),E('Bulgarian Split Squat',3,8,12),E('Seated Leg Curl',3,10,15),E('Leg Extension',2,12,15),E('Calf Raise',3,10,15),E('Hanging Knee Raise',3,10,15)],[E('Hack Squat',3,8,12),E('Reverse Lunge',3,8,12),E('Lying Leg Curl',3,10,15),E('Single-Leg Extension',2,12,15),E('Seated Calf Raise',3,10,15),E('Cable Crunch',3,10,15)],[E('Leg Press',3,8,12),E('Bulgarian Split Squat',3,8,12),E('Romanian Deadlift',3,8,10),E('Leg Extension',2,12,15),E('Standing Calf Raise',3,10,15),E('Ab Crunch Machine',3,10,15)],[E('Hack Squat',2,10,12),E('Reverse Lunge',2,10,12),E('Leg Curl',2,12,15),E('Leg Extension',2,12,15),E('Calf Raise',2,12,15),E('Hanging Knee Raise',2,12,15)]]}
];
let legacy=JSON.parse(localStorage.getItem('ds_profile_v1')||'null');
let profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null')||legacy;
if(profile&&!profile.startWeight)profile.startWeight=profile.currentWeight;
let daily=JSON.parse(localStorage.getItem(DAILY_KEY)||'[]'),sessions=JSON.parse(localStorage.getItem(WORKOUT_KEY)||'[]'),selected=0,draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);
function calorieTarget(p){if(p.manualCalories)return +p.manualCalories;const mult={low:13,light:14,moderate:15,high:16}[p.activity]||15;let c=p.currentWeight*mult;if(p.goalType==='gain')c+=300;if(p.goalType==='lose')c-=400;if(p.goalType==='recomp')c-=100;return Math.max(1200,Math.round(c/50)*50)}
function goalLabel(g){return {gain:'Gain Muscle',lose:'Lose Fat',maintain:'Maintain',recomp:'Recomp'}[g]||'Personal Goal'}
function guidance(p){if(p.goalType==='gain')return 'Build strength and muscle with progressive overload. Aim to add reps or weight while bodyweight trends upward gradually.';if(p.goalType==='lose')return 'Keep lifting hard enough to preserve strength while using a modest calorie deficit and more daily movement.';if(p.goalType==='recomp')return 'Use strength, measurements and bodyweight together. Push progressive overload while keeping calories near maintenance.';return 'Keep training consistently and calories near maintenance while maintaining strength.'}
function splitText(p){const d=Math.max(2,Math.min(4,+p.trainingDays||4));return d===2?'2-day plan using Upper 1 and Lower 1.':d===3?'3-day rotation using Upper 1, Lower 1 and Upper 2.':'4-day upper/lower rotation with weekly exercise variation.'}
function weekNum(){return Math.floor(sessions.length/Math.max(2,Math.min(4,profile?.trainingDays||4)))+1}function phase(){return (weekNum()-1)%4}function phaseLabel(){return ['Foundation','Variation','Progression','Recovery / Technique'][phase()]}
function currentExercises(){return plans[selected].weeks[phase()]}
function yt(n){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' proper form tutorial')}
function lastExercise(name){for(let i=sessions.length-1;i>=0;i--){const x=sessions[i].exercises?.find(e=>e.name===name);if(x)return x}return null}
function suggestion(ex,last){if(!last)return 'Set a clean baseline today.';const done=last.sets.filter(s=>s.done&&s.reps);if(!done.length)return 'Set a clean baseline today.';if(done.every(s=>+s.reps>=ex.max))return 'Top of range reached. Add a small amount of weight next time.';if(done.some(s=>+s.reps<ex.min))return 'Keep the weight and build reps back into range.';return 'Keep the weight and beat last time by at least 1 total rep.'}
function fmtLast(last){if(!last)return 'No previous result.';return last.sets.filter(s=>s.done).map(s=>`${s.weight||0}×${s.reps||0}`).join(' / ')||'No completed sets.'}
function showProfile(edit=false){document.getElementById('profileOverlay')?.remove();const p=profile||{name:'',startWeight:180,currentWeight:180,goalWeight:200,goalType:'gain',activity:'moderate',trainingDays:4,equipment:'full',manualCalories:''};const o=document.createElement('div');o.id='profileOverlay';o.className='overlay';o.innerHTML=`<div class="setup"><img src="${IMG}" alt="" style="width:64px;height:64px;border-radius:16px"><h1>${edit?'Edit your plan':'Build your plan'}</h1><div class="lead">Set your starting point and goal. You can change any of this later.</div><form class="box" id="profileForm"><label>Name</label><input name="name" value="${p.name||''}" placeholder="Your name" required><div class="two"><div><label>Starting weight (lb)</label><input name="startWeight" type="number" step="0.1" min="70" max="700" value="${p.startWeight||p.currentWeight||180}" required></div><div><label>Current weight (lb)</label><input name="currentWeight" type="number" step="0.1" min="70" max="700" value="${p.currentWeight||180}" required></div></div><label>Goal weight (lb)</label><input name="goalWeight" type="number" step="0.1" min="70" max="700" value="${p.goalWeight||200}" required><label>Primary goal</label><select name="goalType"><option value="gain" ${p.goalType==='gain'?'selected':''}>Gain muscle / weight</option><option value="lose" ${p.goalType==='lose'?'selected':''}>Lose fat / weight</option><option value="maintain" ${p.goalType==='maintain'?'selected':''}>Maintain</option><option value="recomp" ${p.goalType==='recomp'?'selected':''}>Recomp</option></select><label>Activity level</label><select name="activity"><option value="low" ${p.activity==='low'?'selected':''}>Low</option><option value="light" ${p.activity==='light'?'selected':''}>Light</option><option value="moderate" ${p.activity==='moderate'?'selected':''}>Moderate</option><option value="high" ${p.activity==='high'?'selected':''}>High</option></select><div class="two"><div><label>Training days/week</label><select name="trainingDays"><option value="2" ${+p.trainingDays===2?'selected':''}>2 days</option><option value="3" ${+p.trainingDays===3?'selected':''}>3 days</option><option value="4" ${+p.trainingDays===4?'selected':''}>4 days</option></select></div><div><label>Equipment</label><select name="equipment"><option value="full" ${p.equipment==='full'?'selected':''}>Full gym</option><option value="dumbbells" ${p.equipment==='dumbbells'?'selected':''}>Dumbbells</option><option value="home" ${p.equipment==='home'?'selected':''}>Home / limited</option></select></div></div><label>Daily calorie target <span class="muted">(optional override)</span></label><input name="manualCalories" type="number" min="1200" max="7000" value="${p.manualCalories||''}" placeholder="Leave blank for automatic target"><button class="save" type="submit">${edit?'Save Changes':'Create My Plan'}</button>${edit?'<button class="closeSetup" type="button" id="closeProfile">Cancel</button>':''}</form></div>`;document.body.appendChild(o);$('profileForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);profile={name:String(f.get('name')).trim(),startWeight:+f.get('startWeight'),currentWeight:+f.get('currentWeight'),goalWeight:+f.get('goalWeight'),goalType:String(f.get('goalType')),activity:String(f.get('activity')),trainingDays:+f.get('trainingDays'),equipment:String(f.get('equipment')),manualCalories:f.get('manualCalories')?+f.get('manualCalories'):null,updatedAt:new Date().toISOString()};localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));o.remove();renderAll()});$('closeProfile')?.addEventListener('click',()=>o.remove())}
function go(v){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='workouts')renderWorkout();scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));$('profileBtn').addEventListener('click',()=>showProfile(!!profile));$('editProfile').addEventListener('click',()=>showProfile(true));
$('df').addEventListener('submit',e=>{e.preventDefault();const r={date:$('date').value,weight:+$('weight').value,cal:+$('cal').value,sleep:+$('sleep').value||0,steps:+$('steps').value||0};daily=daily.filter(x=>x.date!==r.date).concat(r).sort((a,b)=>a.date.localeCompare(b.date));localStorage.setItem(DAILY_KEY,JSON.stringify(daily));if(profile){profile.currentWeight=r.weight;localStorage.setItem(PROFILE_KEY,JSON.stringify(profile))}renderAll();go('home')});
function renderAll(){if(!profile)return;const cur=daily.length?daily.at(-1).weight:profile.currentWeight,start=profile.startWeight,goal=profile.goalWeight,cals=calorieTarget(profile),recent=daily.slice(-7),av=recent.length?recent.reduce((s,x)=>s+x.weight,0)/recent.length:0,total=Math.abs(goal-start),done=Math.abs(cur-start),p=total?Math.max(0,Math.min(100,done/total*100)):100;$('cw').textContent=cur.toFixed(1)+' lb';$('avg').textContent=av?av.toFixed(1)+' lb':'—';$('calMetric').textContent=cals.toLocaleString();$('tg').textContent=Math.abs(goal-cur).toFixed(1)+' lb';$('pct').textContent=p.toFixed(0)+'%';$('bar').style.width=p+'%';$('goalTitle').textContent=goalLabel(profile.goalType)+' Progress';$('milestones').innerHTML=[.25,.5,.75,1].map(x=>`<span class="pill">${(start+(goal-start)*x).toFixed(0)}</span>`).join('');$('guide').textContent=guidance(profile);$('splitText').textContent=splitText(profile);$('homeWeek').innerHTML=`<div class="small red">TRAINING WEEK</div><div class="weekTitle">Week ${weekNum()} · ${phaseLabel()}</div><div class="muted small" style="margin-top:4px">${sessions.length%Math.max(2,Math.min(4,profile.trainingDays))}/${Math.max(2,Math.min(4,profile.trainingDays))} workouts completed this week</div>`;$('cal').value=cals;$('weight').value=cur.toFixed(1);$('dh').innerHTML=daily.slice().reverse().map(x=>`<div class="exercise">${x.date} · ${x.weight} lb · ${x.cal} cal</div>`).join('')||'No entries yet.';$('ph').innerHTML=`<div class="metric">${cur.toFixed(1)} → ${goal.toFixed(1)} lb</div><div class="muted section">Start: ${start.toFixed(1)} lb · Completed workouts: ${sessions.length}</div>`;$('profileBtn').textContent=profile.name||'Profile';$('profileSummary').innerHTML=`<div style="border-top:1px solid #333;margin-top:16px;padding-top:16px"><b>${profile.name||'Your Profile'}</b><div class="goalTag">${goalLabel(profile.goalType)}</div><p class="muted small">${cur.toFixed(1)} lb → ${goal.toFixed(1)} lb · ${profile.trainingDays} days/week · ${cals.toLocaleString()} cal/day</p></div>`;renderWorkoutHistory();renderWorkout()}
function ensureDraft(){const key=`${weekNum()}-${selected}-${phase()}`;if(!draft||draft.key!==key){draft={key,week:weekNum(),plan:selected,phase:phase(),started:new Date().toISOString(),sets:{}};localStorage.setItem(DRAFT_KEY,JSON.stringify(draft))}}
function renderWorkout(){if(!profile)return;const maxTabs=Math.max(2,Math.min(4,profile.trainingDays));if(selected>=maxTabs)selected=0;$('weekBanner').innerHTML=`<div class="small red">ADAPTIVE PROGRAM</div><div class="weekTitle">Week ${weekNum()} · ${phaseLabel()}</div><div class="muted small" style="margin-top:4px">Exercises rotate each training week while performance history stays attached to each movement.</div>`;$('workoutTabs').innerHTML=plans.slice(0,maxTabs).map((p,i)=>`<button class="tab ${i===selected?'active':''}" data-tab="${i}">${p.name}</button>`).join('');$('workoutTabs').querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.tab;draft=null;localStorage.removeItem(DRAFT_KEY);renderWorkout()}));ensureDraft();$('workoutArea').innerHTML=`<div class="card section"><div class="row"><div><h2 style="margin:0">${plans[selected].name}</h2><div class="muted small">Week ${weekNum()} · ${phaseLabel()}</div></div></div>${currentExercises().map((ex,ei)=>exerciseHTML(ex,ei)).join('')}<button id="finishWorkout" class="btn" style="width:100%;margin-top:10px">Finish Workout</button></div>`;$('finishWorkout').addEventListener('click',finishWorkout);$('workoutArea').querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>toggleSet(b.dataset.set)));$('workoutArea').querySelectorAll('[data-field]').forEach(i=>i.addEventListener('change',()=>setVal(i.dataset.key,i.dataset.field,i.value)))}
function exerciseHTML(ex,ei){const last=lastExercise(ex.name);return `<div class="exercise"><div class="exerciseHead"><div><h3>${ex.name}</h3><div class="last">Last: ${fmtLast(last)}</div><div class="target">${suggestion(ex,last)}</div></div><a class="demo" href="${yt(ex.name)}" target="_blank" rel="noopener">▶ Demo</a></div><div class="small muted" style="margin-top:8px">${ex.sets} sets · ${ex.min}–${ex.max} reps</div>${Array.from({length:ex.sets},(_,si)=>setHTML(ei,si,last)).join('')}</div>`}
function setHTML(ei,si,last){const k=`${ei}-${si}`,v=draft.sets[k]||{},prev=last?.sets?.[si]||{};return `<div class="setrow"><div class="setnum">${si+1}</div><input class="input" data-key="${k}" data-field="weight" type="number" step="2.5" placeholder="${prev.weight||'lb'}" value="${v.weight??''}"><input class="input" data-key="${k}" data-field="reps" type="number" placeholder="${prev.reps||'reps'}" value="${v.reps??''}"><button class="check ${v.done?'done':''}" data-set="${k}" type="button">${v.done?'✓':'○'}</button></div>`}
function setVal(k,f,val){ensureDraft();draft.sets[k]=draft.sets[k]||{};draft.sets[k][f]=val;localStorage.setItem(DRAFT_KEY,JSON.stringify(draft))}function toggleSet(k){ensureDraft();draft.sets[k]=draft.sets[k]||{};draft.sets[k].done=!draft.sets[k].done;localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));renderWorkout()}
function finishWorkout(){ensureDraft();const built=currentExercises().map((ex,ei)=>({name:ex.name,range:[ex.min,ex.max],sets:Array.from({length:ex.sets},(_,si)=>{const v=draft.sets[`${ei}-${si}`]||{};return{weight:+v.weight||0,reps:+v.reps||0,done:!!v.done}})}));const completed=built.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);if(!completed){alert('Complete at least one set first.');return}sessions.push({id:Date.now(),date:new Date().toISOString(),week:weekNum(),plan:plans[selected].name,phase:phaseLabel(),exercises:built});localStorage.setItem(WORKOUT_KEY,JSON.stringify(sessions));draft=null;localStorage.removeItem(DRAFT_KEY);renderAll();alert('Workout saved. Your next targets now use this performance.')}
function renderWorkoutHistory(){$('workoutHistory').innerHTML=sessions.slice().reverse().slice(0,8).map(s=>`<div class="historyItem"><b>${s.plan}</b> · Week ${s.week}<div class="small muted">${new Date(s.date).toLocaleDateString()} · ${s.phase}</div></div>`).join('')||'No completed workouts yet.'}
if(profile){localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));renderAll()}else showProfile(false);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
